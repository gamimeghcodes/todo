<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: flex;
            justify-content: center;
        }
    </style>
    
</head>
<body>
    <div><h1 id="num">0</h1><br>
    
    </div>
    <div>
        <button id="inc" onclick="inc()">➕</button>
        <button id="dec" onclick="dec()">➖</button>
        <button id="reset" onclick="reset()">🔁</button></div>

        <script>
        let data=document.getElementById("num")
        number=parseInt(data.innerText)
        function inc(){
            number+=1
            data.innerHTML=number
        }
        
        function dec(){
            number-=1
            data.innerHTML=number
       }

       function reset(){
        number=0
        data.innerHTML=number
       }
    </script>
</body>
</html>
